# TODO: currently editing this file requires a *manual* restart of the
# puppetserver service on lightning

version: 5

defaults:
  datadir: hieradata
  data_hash: yaml_data

hierarchy:
  - name: "Private config (passwords, etc.)"
    path: "private.yaml"

  - name: "Nodes"
    path: "nodes/%{facts.networking.hostname}.yaml"

  - name: "Type"
    path: "type/%{::type}.yaml"

  - name: "Virtual or physical"
    path: "is_virtual/%{facts.is_virtual}.yaml"

  - name: "OS version"
    path: "os/%{facts.os.distro.codename}.yaml"

  - name: "Common defaults"
    path: "common.yaml"

  - name: "Kubernetes hosts"
    path: "kubernetes/hosts/%{facts.networking.hostname}.yaml"

  - name: "Kubernetes os"
    path: "kubernetes/os/%{facts.os.family}.yaml"

  - name: "Dummy secrets"
    path: "dummy_secrets.yaml"
